<script>
/* ============ REFERENCIAS ============ */
// Checklist ARA-FOR-GRH-633 Rev 00 (16-FEB-2026) · TRC HUBs
const CK=[
 ['A','Preparación del vuelo (90 min STD)',[
  ['a1','Busca la información del vuelo (n.º de vuelo, matrícula, destino, fecha, horario, maletas en conexión)',''],
  ['a2','Briefing con el personal involucrado (carga, control de vuelo, AVSEC) y asigna posiciones: seguridad, conectividad y directrices','pax'],
  ['a3','Reconoce los medios de comunicación; HCC es el medio oficial para recibir y reportar novedades','nov'],
  ['a4','Equipos y herramientas: chaleco, radio, celular, formularios, info de conexiones, LIR, headset y pin',''],
  ['a5','Controla la operación con el Gantt según el TAT y marca los tiempos a las áreas','reg'],
  ['a6','Walkaround antes, durante y después, libre de FOD; reportó irregularidades o daños a HCC, Mantenimiento o Tripulación','nov']]],
 ['B','Llegada (70–40 min STD)',[
  ['b1','Equipos solicitados y en rampa según Gantt: catering, potable, drenaje, limpieza + insumos, sillas de ruedas, fuel, GPU, ACU/ASU','gse'],
  ['b2','Información soportada en tiempos y evidencias para que HCC tenga claridad de los motivos de demora','reg'],
  ['b3','Seguro aproximarse a la aeronave (luces anticolisión apagadas)',''],
  ['b4','Confirma con AVSEC y proveedor de rampa que están listos para el descargue y vagones en posición',''],
  ['b5','Cargue coincide con la LIR y equipajes segregados para la conectividad','docs'],
  ['b6','Cargue conforme a la LIR; reporta novedades a Despacho','nov'],
  ['b7','Entrega documentos de vuelo al capitán (Briefing Pack y Fuel Order); necesidades de tripulación; avisa si hay gaseo con pasajeros a bordo','docs'],
  ['b8','Firma la hoja de constancia de limpieza al confirmar que el servicio se ejecutó','docs'],
  ['b9','Coordina y supervisa abastecimiento, descarga de equipajes, catering y acoplamiento de equipos al fuselaje','gse'],
  ['b10','Entrega la LIR al capitán y al proveedor de rampa; revisa equipajes con la LIR de llegada y reporta discrepancias','docs'],
  ['b11','Confirma con AVSEC los números finales del make-up y los relaciona con el total cargado y gate','']]],
 ['C','Abordaje y cargado (35–5 min STD)',[
  ['c1','Equipajes removidos en la puerta de embarque contabilizados para el cierre y llevados a bodega',''],
  ['c2','Confirma fin de abordaje y coordina búsqueda de maletas de no-show según el Gantt (D-15)','pax'],
  ['c3','Confirma con Despacho el total de pasajeros y equipajes y da el cierre final','pax'],
  ['c4','Barra y tractor de pushback en posición al menos 10 min antes de la salida (D-10)','reg'],
  ['c5','Firma del capitán tras revisar LIR, Fuel y Flight Plan','docs'],
  ['c6','Headset tierra-cabina (ETD-5), si aplica','reg']]]
];
const CKN=CK.reduce((a,s)=>a+s[2].length,0);
const SCEN={std:['60 min · Estándar',60],usa:['75 min · USA (Cabin Search)',75],ds:['80 min · Deep South',80],cnx:['90 min · Conectividad',90]};
const GSE_T=['GPU','ACU','ASU','Escalera de pasajeros','Banda de equipaje','Tractor de pushback','Barra de remolque','Carros de equipaje','COBUS','Ambulift / silla de ruedas','Puente de embarque (PBB)','Camión de catering','Camión de agua potable','Camión de drenaje (waste)'];
const DOCT=[['bp','Brief Pack','Despacho'],['fp','Flight Plan','Despacho'],['fo','Fuel Order','Despacho'],['lir','LIR','HCC'],['ls','Loadsheet (contingencia EFB/ACARS)','Despacho'],['gd','Gendecs sellados por Migración','TRC'],['cap','Firma del capitán (LIR, Fuel, Flight Plan)','Capitán']];
const HOJT=[['limp','Constancia de limpieza'],['comb','Recibo / documentación de combustible'],['cat','Hoja de catering'],['agua','Agua potable y waste'],['rampa','Hoja de servicio de rampa (GHA)']];
const DELAY=[['11','Check-in tardío (PAX)'],['15','Embarque (PAX)'],['18','Procesamiento de equipaje en plataforma'],['31','Documentación de aeronave / rampa'],['32','Carga / descarga'],['33','Falta o falla de equipo de carga'],['34','Falta o falla de equipo de servicio (GSE)'],['35','Limpieza'],['36','Combustible'],['37','Catering'],['41','Defecto de aeronave'],['51','Daño en operación de tierra'],['63','Tripulación tardía'],['93','Rotación de aeronave (llegada tardía)']];
const NOVC=['Seguridad (Safety)','Protección (Security)','Equipajes','PRM / pasajeros','Combustible','GSE / equipos','Aeronave / daños','Proveedor','Documentación','Otra'];
const ROLES={TRC:'Turnaround Coordinator',SPAX:'Sup. Servicio al Pasajero',SUP:'Supervisor GOPS'};
const USERS=[['u1','Sup. GOPS Demo','SUP','S-0001'],['u2','Sup. Pasajeros Demo','SPAX','P-0001'],['u3','TRC Demo 1','TRC','T-1001'],['u4','TRC Demo 2','TRC','T-1002'],['u5','TRC Demo 3','TRC','T-1003']];
const MIN=60000;let AT=0;const stamp=()=>now()-AT*MIN;

/* ============ PASOS CON BLOQUEO (STOPPERS) ============
   req = pasos que deben estar hechos antes; chk = condiciones que deben cumplirse.
   Base: GOM 4.4.3 (calzos; GPU «si es necesario»; PBB/escalera y GSE solo tras el walkaround), ARA-DAT-GRH-603/633, Gantt 303.
   PROPUESTA: validar cada bloqueo con Operaciones. */
const ACTS=[
 {id:'brief',t:'Briefing con el equipo',off:()=>90,req:[],run:r=>{Mk(r,'brief');Ck(r,'a2')}},
 {id:'go',t:'Chocks ON · calzos puestos',off:r=>need(r)/MIN,req:[],run:r=>Mk(r,'go')},
 {id:'walk1',t:'Walkaround de llegada, sin FOD',off:r=>need(r)/MIN-2,req:['go'],run:r=>Mk(r,'walk1')},
 {id:'eq',t:'Equipos de la posición conectados',off:r=>need(r)/MIN-4,req:['go','walk1'],chk:[chkGse],run:r=>{Mk(r,'eq');Ck(r,'b1')}},
 {id:'docs',t:'Brief Pack y Fuel Order entregados',off:()=>55,req:['go'],run:r=>{Dl(r,'bp');Dl(r,'fo');Mk(r,'docs')},done:r=>r.insp.docs.bp.deliv&&r.insp.docs.fo.deliv},
 {id:'lir',t:'LIR entregada al Crew Chief',off:()=>45,req:['go'],run:r=>{Dl(r,'lir');Mk(r,'lir')},done:r=>r.insp.docs.lir.deliv},
 {id:'mkup',t:'Make-up cerrado con AVSEC',off:()=>40,req:['go'],run:r=>{Mk(r,'mkup');Ck(r,'b11')}},
 {id:'limp',t:'Constancia de limpieza firmada',off:()=>36,req:['go'],kind:'foto',done:r=>!!r.insp.hojas.limp,run:()=>{}},
 {id:'emb',t:'Inicio de embarque',off:()=>35,req:['eq','limp'],run:r=>Mk(r,'emb')},
 {id:'barra',t:'Barra y tractor en posición',off:()=>25,req:['go'],run:r=>{Mk(r,'barra');Ck(r,'c4')}},

  const i=r.insp,has=t=>i.gse.some(g=>g.type===t),items=[];let note='';

    else{items.push({lbl:'GPU',ok:has('GPU'),hard:true},{lbl:'ACU',ok:has('ACU'),hard:true});note='Posición remota: GPU y ACU en tierra, salvo que el avión use APU. ASU solo si aplica.'}

  }else{
    items.push({lbl:'Puente de embarque (PBB)',ok:has('Puente de embarque (PBB)'),hard:true});

  else if(a==='ovrreq'){r.insp.req={act:d.id,why:V('owhy'),at:now(),by:me()[1]};log('Pidió desbloqueo «'+actById(d.id).t+'» en '+r.dep.num+' ('+V('owhy')+')');queue();toast('Solicitud enviada al supervisor')}

  else if(a==='handack'){const h=(r.insp.hand||[]);if(h.length)h[h.length-1].ack=true}

/* ===== Archivos locales (IndexedDB): fotos y documentos, disponibles sin conexión ===== */
const IMG={};let DB=null;
function idb(){return new Promise((ok,no)=>{if(DB)return ok(DB);if(!window.indexedDB)return no('sin IndexedDB');const q=indexedDB.open('trc_app',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>{DB=q.result;ok(DB)};q.onerror=()=>no(q.error)})}
async function fileSave(blob){const key='f'+Date.now()+Math.random().toString(36).slice(2,6);try{const db=await idb();await new Promise((ok,no)=>{const tx=db.transaction('f','readwrite');tx.objectStore('f').put(blob,key);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)})}catch(e){}IMG[key]=URL.createObjectURL(blob);return key}
async function imgLoad(){try{const db=await idb();const st=db.transaction('f').objectStore('f');const ks=await new Promise(ok=>{const q=st.getAllKeys();q.onsuccess=()=>ok(q.result)});for(const k of ks){const b=await new Promise(ok=>{const q=st.get(k);q.onsuccess=()=>ok(q.result)});if(b&&!IMG[k])IMG[k]=URL.createObjectURL(b)}render()}catch(e){}}
function shrink(file,cb){const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,1000/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(async b=>cb(await fileSave(b)),'image/jpeg',.7)};im.src=rd.result};rd.readAsDataURL(file)}
function registerSW(){if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}
/* ===== Pasos: hora retroactiva y desbloqueo ===== */
function doAct(r,id,back){
  const ac=actById(id),u=unmet(r,ac),f=chkFail(r,ac);
  if(u.length){toast('PARE: antes falta «'+u[0].t+'»','red');return false}
  if(f.length){toast('PARE: '+f[0].msg,'red');return false}
  if(ac.kind==='num'&&!V('qpax').trim()){toast('Escriba la cifra de pasajeros','red');return false}
  let why='';
  if(back){why=V('bwhy');if(!why){toast('Indique el motivo de la hora retroactiva','red');return false}
    if(id==='go'&&r.arr.ata&&now()-back*MIN<r.arr.ata){toast('Chocks ON no puede ser antes del ATA ('+hm(r.arr.ata)+')','red');return false}}
  window._undo={id:r.id,snap:JSON.stringify(r.insp)};
  if(back){(r.insp.edits=r.insp.edits||[]).push({t:now(),act:id,min:back,why,by:me()[1]});log('Hora retroactiva −'+back+' min en «'+ac.t+'» ('+why+') · '+r.dep.num);S.backFor=null}
  if(!r.insp.started)r.insp.started=now();
  AT=back||0;try{ac.run(r,V('qpax'))}finally{AT=0}
  syncAuto(r);log(ac.t+' · '+r.dep.num);queue();save();render();toastUndo(ac.t);window.scrollTo(0,0);return true}
function backUI(r,a){

function handBanner(r){const h=r.insp.hand||[],l=h[h.length-1];if(!l||l.ack||role()!=='TRC'||l.to!==me()[1])return '';
  return `<div class="pn" style="border-color:var(--o)"><div class="lbl amb">RELEVO RECIBIDO</div><div class="pb"><div>Recibió este vuelo de <b>${esc(l.from)}</b> a las ${hm(l.at)}. Está en el paso <b>${l.step} de ${ACTS.length}</b>. Revise el avance antes de continuar.</div><button class="b" style="margin-top:10px" data-a="handack">Entendido</button></div></div>`}
function relevoUI(r){if(role()!=='TRC'||r.insp.cerrada||!r.insp.started)return '';

  return `<div class="pn"><div class="lbl">RELEVO DE VUELO</div><div class="pb"><div class="sub">El otro TRC recibe el vuelo en el paso en que está y ve todo su avance.</div><span class="fl">Relevar a</span><select id="rvto">${others.map(u=>`<option value="${u[0]}">${u[1]}</option>`).join('')}</select><div class="row" style="margin-top:10px"><button class="b sec" data-a="relevotoggle">Cancelar</button><button class="b" data-a="relevo">Confirmar relevo</button></div></div></div>`}
function enCurso(v){const ec=v.filter(r=>r.insp.started&&!r.insp.cerrada);if(ec.length<2)return '';
  return `<div class="pn"><div class="lbl">EN CURSO AHORA (${ec.length})</div>${ec.map(r=>{const cu=curAct(r),go=r.insp.ms.go,el=go?Math.round((now()-go)/MIN):null;return `<div class="rw" data-a="open" data-id="${r.id}" style="cursor:pointer"><div class="grow"><b>${r.dep.num}</b> · POS ${esc(r.gate)}<div class="sub">${cu?esc(cu.a.t):'Listo para cerrar'}</div></div>${cu&&cu.fails.length?'<span class="st red">PARE</span>':''}<span class="st ln">${el!=null?'T+'+el+' min':'sin Chocks'}</span></div>`}).join('')}</div>`}
/* ===== QR de posición (opcional; apagado por defecto) ===== */
function qrPanel(r){return `<div class="pn"><div class="lbl"><span>QR DE POSICIÓN (OPCIONAL)</span><button class="b sm sec" style="min-height:26px;padding:0 8px" data-a="qrclose">Cerrar</button></div><div class="pb"><video id="qrv" playsinline muted style="width:100%;max-height:220px;background:#000;border-radius:10px"></video><div class="sub" id="qrmsg" style="margin:8px 0">Apunte al código de la posición.</div><span class="fl">…o escriba el código (ej. POS:4:R o 4R)</span><div class="row"><input id="qrtxt" placeholder="POS:4:R"><button class="b sm" data-a="qrapply">Aplicar</button></div></div></div>`}
function qrMsg(m){const e=document.getElementById('qrmsg');if(e)e.textContent=m}
async function qrStart(){const v=document.getElementById('qrv');if(!v||window._qr)return;window._qr=true;
  try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});window._qrs=st;v.srcObject=st;await v.play();
    if(!('BarcodeDetector' in window)){qrMsg('Este navegador no lee QR: escriba el código.');return}
    const det=new BarcodeDetector({formats:['qr_code']});
    const loop=async()=>{if(!window._qr||!document.getElementById('qrv'))return;try{const c=await det.detect(v);if(c.length){qrApply(c[0].rawValue);return}}catch(e){}setTimeout(loop,300)};loop()}
  catch(e){qrMsg('No se pudo abrir la cámara: escriba el código.')}}
function qrStop(){window._qr=false;if(window._qrs){window._qrs.getTracks().forEach(t=>t.stop());window._qrs=null}S.qrOpen=null}
function qrApply(raw){const r=cur(),s=String(raw||'').trim();const m=/^POS:([A-Za-z0-9]+):([CR])$/i.exec(s)||/^(\d+[A-Za-z]?)([CR])$/i.exec(s);
  if(!r||!m){qrMsg('Código no válido: '+s);toast('Código de posición no válido','red');return}
  const old=r.gate+' '+tipo(r);r.gate=m[1].toUpperCase();r.pt=m[2].toUpperCase();log('Posición por QR en '+r.dep.num+': '+old+' → '+r.gate+' '+tipo(r));qrStop();queue();save();render();toast('Posición '+r.gate+' · '+tipo(r))}
const _render0=render;render=function(){_render0();if(S.opts&&S.opts.qr&&S.qrOpen&&!window._qr)setTimeout(qrStart,60)};
/* ===== Supervisor: barra, importación de itinerario ===== */
function supBar(){if(role()!=='SUP')return '';const pend=S.rots.filter(r=>r.insp.req&&!r.insp.cerrada).length;
  return `<div class="pn"><div class="pb row sp wr"><div class="row wr"><button class="b sm" data-a="page" data-k="imp">Cargar itinerario (CSV)</button>${pend?`<span class="st amb">${pend} solicitud(es) de desbloqueo</span>`:''}</div><div class="row"><span class="sub">QR de posición (opcional)</span><button class="b sm ${S.opts.qr?'':'sec'}" data-a="opt" data-k="qr">${S.opts.qr?'Activado':'Apagado'}</button></div></div></div>`}
const IMPH=['matricula','posicion','tipo','vuelo_llegada','origen','sta','eta','ata','vuelo_salida','destino','std','escenario','trc_id'];
function csvTpl(){return [IMPH.join(';'),'HI-0001;4;R;6269;SCL;13:45;13:50;;6268;EZE;15:05;ds;T-1001','HI-0002;7;C;6171;SDQ;16:20;16:20;;6172;YUL;17:20;std;T-1002']}
function parseCSV(tx){const lines=tx.replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return [];const sep=[';','\t',','].find(s=>lines[0].includes(s))||';';return lines.map(l=>l.split(sep).map(c=>c.trim().replace(/^"|"$/g,'')))}
function hmTs(s){const m=/^(\d{1,2}):(\d{2})$/.exec((s||'').trim());if(!m)return null;const d=new Date(now());d.setHours(+m[1],+m[2],0,0);return d.getTime()}
function newInsp(){return {started:null,checks:{},ms:{},gse:[],docs:Object.fromEntries(DOCT.map(([k])=>[k,{st:k==='ls'?'na':'pend'}])),hojas:{},nov:[],pax:{},delay:null,firma:null,cerrada:null,notas:'',apu:false}}
function buildRot(reg,gate,pt,an,from,sta,eta,ata,dn,to,std,sc,trc){buildRot.n=(buildRot.n||0)+1;
  const arr={num:'DM'+an,o:from,d:'PUJ',std:null,sta,etd:null,eta,atd:null,ata:ata||null,dep:null,land:null};
  const dep={num:'DM'+dn,o:'PUJ',d:to,std,sta:null,etd:std,eta:null,atd:null,ata:null,dep:null,land:null};
  return {id:'r'+(Date.now()%1e9)+'_'+buildRot.n,reg,gate,pt,arr,dep,sc,trc,insp:newInsp()}}
function importRows(tx){const rows=parseCSV(tx),err=[],out=[];const st=(rows[0]&&/matricula/i.test(rows[0].join(' ')))?1:0;
  rows.slice(st).forEach((c,i)=>{const ln=i+st+1,[reg,gate,tp,an,from,sta,eta,ata,dn,to,std,sc,tid]=c,e=[];
    if(!reg)e.push('matrícula');if(!gate)e.push('posición');if(!/^[CR]$/i.test(tp||''))e.push('tipo (C o R)');if(!an)e.push('vuelo de llegada');if(!from)e.push('origen');if(hmTs(sta)==null)e.push('STA (HH:MM)');if(!dn)e.push('vuelo de salida');if(!to)e.push('destino');if(hmTs(std)==null)e.push('STD (HH:MM)');
    const scen=(sc||'std').toLowerCase();if(!SCEN[scen])e.push('escenario (std, usa, ds o cnx)');
    const u=tid?USERS.find(x=>x[3].toLowerCase()===tid.toLowerCase()&&x[2]==='TRC'):null;if(tid&&!u)e.push('trc_id desconocido');
    if(e.length){err.push('Línea '+ln+': falta o es inválido → '+e.join(', '));return}
    const tSta=hmTs(sta);let tStd=hmTs(std);if(tStd<=tSta)tStd+=864e5;
    out.push(buildRot(reg,gate,tp.toUpperCase(),an,from,tSta,hmTs(eta)??tSta,hmTs(ata),dn,to,tStd,scen,u?u[0]:null))});
  return {out,err}}
function doImport(){const tx=V('csvtxt');S.csvtxt=tx;S.impok=null;
  if(!tx.trim()){S.imperr=['No hay contenido para importar.'];save();render();return}
  const {out,err}=importRows(tx);
  if(err.length||!out.length){S.imperr=err.length?err:['No se encontraron filas válidas.'];save();render();return}
  if(S.impmode!=='add'&&S.rots.some(r=>r.insp.started)&&!S.impconfirm){S.impconfirm=true;S.imperr=['Hay rotaciones con inspección iniciada. Si reemplaza, se descartan. Toque Importar otra vez para confirmar, o elija Agregar.'];save();render();return}
  S.impconfirm=false;S.rots=S.impmode==='add'?S.rots.concat(out):out;S.imperr=null;S.impok=out.length+' rotación(es) importada(s). Ya aparecen en el itinerario.';log('Importó itinerario: '+out.length+' rotación(es) ('+(S.impmode==='add'?'agregadas':'reemplazo')+')');save();render()}
function vImp(){
  return hero('Cargar itinerario','Importe las rotaciones del día desde un archivo CSV o pegando el texto. Cada fila es una rotación: llegada y salida de la misma aeronave.')+
  `<div class="pn"><div class="lbl">PASO 1 · PLANTILLA</div><div class="pb"><div class="sub">Columnas: ${IMPH.join(', ')}. Horas HH:MM. tipo: C (contacto) o R (remota). escenario: std, usa, ds o cnx. trc_id es opcional (ej. T-1001). Desde Excel use Guardar como → CSV.</div><button class="b sm" style="margin-top:10px" data-a="csvtpl">Descargar plantilla</button></div></div>
  <div class="pn"><div class="lbl">PASO 2 · ARCHIVO O TEXTO</div><div class="pb"><label class="b sec" style="cursor:pointer">Elegir archivo CSV<input type="file" accept=".csv,.txt,text/csv" hidden data-csv="1"></label><span class="fl">…o pegue el contenido</span><textarea id="csvtxt" rows="6" placeholder="matricula;posicion;tipo;…">${esc(S.csvtxt||'')}</textarea>
  <span class="fl">¿Qué hacer con el itinerario actual?</span><div class="seg"><button class="${S.impmode!=='add'?'sel':''}" data-a="impmode" data-v="rep">Reemplazarlo</button><button class="${S.impmode==='add'?'sel':''}" data-a="impmode" data-v="add">Agregar</button></div>
  <button class="b" style="margin-top:12px" data-a="impgo">Importar</button>${S.imperr&&S.imperr.length?`<div class="stop"><div class="big" style="font-size:22px">REVISAR</div><ul>${S.imperr.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`:''}${S.impok?`<div class="nt">${esc(S.impok)}</div>`:''}</div></div>
  <div style="margin-top:12px"><button class="b sm sec" data-a="page" data-k="itin">← Itinerario</button></div>`}
/* ===== Indicadores y exportación ===== */
const fdt=ts=>ts?new Date(ts).toLocaleString('sv-SE').slice(0,16):'';
function dl(name,rows){const csv='\uFEFF'+rows.map(r=>r.map(c=>{c=String(c??'');return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function csvGse(){const rows=[['fecha','vuelo_llegada','vuelo_salida','matricula','posicion','tipo_posicion','usa_apu','equipo','unidad','proveedor','inicio','fin','minutos','facturable']];
  S.rots.forEach(r=>r.insp.gse.forEach(g=>{const m=Math.round(((g.end||now())-g.start)/MIN),gp=g.type==='GPU'||g.type==='ACU';let f='Sí';if(r.insp.apu&&gp)f='No (usa APU)';else if(r.pt==='C'&&gp)f='Revisar (posición de contacto)';rows.push([dmy(r.dep.std),r.arr.num,r.dep.num,r.reg,r.gate,tipo(r),r.insp.apu?'Sí':'No',g.type,g.unit,g.prov,fdt(g.start),fdt(g.end),m,f])}));dl('gse_facturacion.csv',rows)}
function csvRot(){const rows=[['fecha','vuelo_llegada','vuelo_salida','matricula','posicion','tipo','STA','ETA','ATA','chocks_on','STD','off_block','tat_real_min','demora_min','codigo_demora','responsable_demora','trc','estado','horas_retroactivas','desbloqueos']];
  S.rots.forEach(r=>{const i=r.insp;rows.push([dmy(r.dep.std),r.arr.num,r.dep.num,r.reg,r.gate,tipo(r),fdt(r.arr.sta),fdt(r.arr.eta),fdt(r.arr.ata),fdt(i.ms.go),fdt(r.dep.std),fdt(i.ms.ob||r.dep.atd),i.ms.go&&i.ms.ob?Math.round((i.ms.ob-i.ms.go)/MIN):'',i.delay?i.delay.min:'',i.delay?i.delay.code:'',i.delay?i.delay.resp:'',uname(r.trc)||'',i.cerrada?'Cerrada':rstat(r)[0],(i.edits||[]).length,Object.keys(i.ovr||{}).length])});dl('rotaciones.csv',rows)}
function vKpi(){
  const rs=S.rots,cer=rs.filter(r=>r.insp.cerrada);
  const tat=cer.map(r=>r.insp.ms.go&&r.insp.ms.ob?Math.round((r.insp.ms.ob-r.insp.ms.go)/MIN):null).filter(x=>x!=null),avg=tat.length?Math.round(tat.reduce((a,b)=>a+b,0)/tat.length):null;
  const dls=rs.filter(r=>r.insp.delay),dmin=dls.reduce((a,r)=>a+r.insp.delay.min,0);
  const lateGo=rs.filter(r=>r.insp.ms.go&&r.arr.ata&&r.insp.ms.go-r.arr.ata>5*MIN).length,noGo=rs.filter(r=>r.arr.ata&&!r.insp.ms.go&&!r.insp.cerrada).length;
  const nE=rs.reduce((a,r)=>a+(r.insp.edits||[]).length,0),nO=rs.reduce((a,r)=>a+Object.keys(r.insp.ovr||{}).length,0);
  const causes={};dls.forEach(r=>{const k=r.insp.delay.code+' · '+((DELAY.find(d=>d[0]===r.insp.delay.code)||[])[1]||'');causes[k]=(causes[k]||0)+r.insp.delay.min});
  const gse={};rs.forEach(r=>r.insp.gse.forEach(g=>{gse[g.type]=(gse[g.type]||0)+((g.end||now())-g.start)/MIN}));
  const bars=(o,u)=>{const e=Object.entries(o).sort((a,b)=>b[1]-a[1]),m=Math.max(1,...e.map(x=>x[1]));return e.length?`<div class="bars">${e.map(([k,v])=>`<div class="br"><span>${esc(k)}</span><div><i style="width:${Math.round(v/m*100)}%"></i></div><b>${Math.round(v)}${u}</b></div>`).join('')}</div>`:'<div class="pb sub">Sin datos.</div>'};
  const trcs=USERS.filter(u=>u[2]==='TRC').map(u=>{const m=rs.filter(r=>r.trc===u[0]);return `<tr><td>${u[1]}</td><td>${m.length}</td><td>${m.filter(r=>r.insp.cerrada).length}</td><td>${m.reduce((a,r)=>a+(r.insp.delay?r.insp.delay.min:0),0)} min</td><td>${m.reduce((a,r)=>a+(r.insp.edits||[]).length,0)}</td><td>${m.reduce((a,r)=>a+Object.keys(r.insp.ovr||{}).length,0)}</td></tr>`}).join('');
  return hero('Indicadores','Resumen de la jornada en PUJ con lo registrado en la app. Con datos de demostración.')+
  `<div class="g4"><div><div class="k">Rotaciones</div><b>${rs.length}</b></div><div><div class="k">Cerradas</div><b>${cer.length}</b></div><div><div class="k">TAT real promedio</div><b>${avg!=null?avg+' min':'—'}</b></div><div><div class="k">Demora total</div><b>${dmin} min</b></div></div>
  <div class="g4"><div><div class="k">Chocks ON tarde (&gt;5 min)</div><b>${lateGo}</b></div><div><div class="k">Sin Chocks ON ahora</div><b>${noGo}</b></div><div><div class="k">Horas retroactivas</div><b>${nE}</b></div><div><div class="k">Desbloqueos</div><b>${nO}</b></div></div>
  <div class="pn"><div class="lbl">MINUTOS DE DEMORA POR CAUSA</div>${bars(causes,' min')}</div>
  <div class="pn"><div class="lbl">USO DE GSE (MINUTOS)</div>${bars(gse,' min')}</div>
  <div class="pn"><div class="lbl">POR TRC</div><div class="tw"><table><thead><tr><th>TRC</th><th>Rotaciones</th><th>Cerradas</th><th>Demora</th><th>Horas retro.</th><th>Desbloqueos</th></tr></thead><tbody>${trcs}</tbody></table></div></div>
  <div class="pn"><div class="lbl">EXPORTAR</div><div class="pb row wr"><button class="b sm" data-a="csvgse">GSE para facturación (CSV)</button><button class="b sm sec" data-a="csvrot">Rotaciones (CSV)</button></div></div>`}
let drawing=false;
function pt(e,c){const b=c.getBoundingClientRect();return [(e.clientX-b.left)*c.width/b.width,(e.clientY-b.top)*c.height/b.height]}
document.addEventListener('pointerdown',e=>{if(e.target.id!=='sig')return;drawing=true;const c=e.target,x=c.getContext('2d');x.lineWidth=4;x.lineCap='round';x.strokeStyle='#14110F';x.beginPath();const[p,q]=pt(e,c);x.moveTo(p,q);window._sig=true;c.setPointerCapture(e.pointerId)});
document.addEventListener('pointermove',e=>{if(!drawing||e.target.id!=='sig')return;const c=e.target,x=c.getContext('2d'),[p,q]=pt(e,c);x.lineTo(p,q);x.stroke()});
document.addEventListener('pointerup',()=>{drawing=false});
setInterval(()=>{const t=document.activeElement&&document.activeElement.tagName;if(!['INPUT','TEXTAREA','SELECT'].includes(t)&&!window._sig&&!window._qr){S._keep=true;render()}},30000);
setInterval(alertCheck,15000);
S.rots.forEach(syncAuto);applyTheme();save();
render();imgLoad();registerSW();
